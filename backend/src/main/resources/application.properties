# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── H2 In-Memory Database (zero setup — no MySQL needed) ────────────────────
spring.datasource.url=jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Ensure Hibernate creates the schema BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true

# ── H2 Web Console  (http://localhost:8080/h2-console) ───────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── Data initialization ───────────────────────────────────────────────────────
spring.sql.init.mode=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.ems=INFO
logging.level.org.hibernate.SQL=WARN
